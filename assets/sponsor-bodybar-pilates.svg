  <!-- BODYBAR text -->
  <text x="200" y="116"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-weight="300"
    font-size="52"
    fill="#6b6b6b"
    text-anchor="middle"
    letter-spacing="6">BODYBAR</text>

  <!-- PILATES text -->
  <text x="200" y="150"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-weight="300"
    font-size="22"
    fill="#aaaaaa"
    text-anchor="middle"
    letter-spacing="10">PILATES</text>
</svg>
