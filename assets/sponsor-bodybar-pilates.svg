<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="400" height="180">
  <!-- Background -->
  <rect width="400" height="180" fill="white"/>

  <!-- Dumbbell / heartbeat icon -->
  <polyline points="128,52 138,32 143,52 148,18 153,52 158,42 163,52"
    fill="none" stroke="#4ec9c0" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="163" y1="52" x2="237" y2="52"
    stroke="#4ec9c0" stroke-width="4.5" stroke-linecap="round"/>
  <polyline points="237,52 242,42 247,52 252,18 257,52 262,32 272,52"
