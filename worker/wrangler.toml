name = "southern-reign-store"
main = "src/index.js"
compatibility_date = "2026-01-01"

[vars]
# The Google Sheet that holds the Products and Orders tabs.
SHEET_ID = "1JVU0xZ4HEpArKummTX_Z2E2axJo1GQWLYIByqpX4DfE"

# Origins allowed to call this API. The first one is used as the fallback.
ALLOWED_ORIGINS = "https://www.southernreignbaseball.com,https://southernreignbaseball.com"

# Storage for uploaded product images. Create the namespace with
#   wrangler kv namespace create IMAGES
# and paste the id it prints below (or bind it in the dashboard).
# [[kv_namespaces]]
# binding = "IMAGES"
# id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secrets are NOT set here. Set them with wrangler so they stay encrypted:
#   wrangler secret put ADMIN_PASSWORD
#   wrangler secret put SESSION_SECRET
#   wrangler secret put GOOGLE_SA_EMAIL
#   wrangler secret put GOOGLE_SA_KEY
